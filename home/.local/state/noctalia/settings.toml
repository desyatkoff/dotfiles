config_version = 13

[audio]
sound_volume = 1.0

[bar.default]
background_opacity = 0.8
capsule = true
capsule_padding = 8.0
capsule_radius = 8
capsule_thickness = 0.8
end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_ends = 8
padding = 8
radius = 8
start = [ "launcher", "workspaces" ]
thickness = 32
widget_spacing = 8

    [bar.default.dead_zone.actions]
    right = "none"

[brightness]
enable_ddcutil = true

[control_center]
sidebar_section = "none"
width = 800

    [control_center.calendar]
    show_events_card = false
    show_week_numbers = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.8
icon_size = 32
inactive_opacity = 0.8
inactive_scale = 1.0
item_spacing = 8
magnification_scale = 1.5
main_axis_padding = 8
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Perm, Russia"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DVI-D-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DVI-D-1"]
    box_height = 196.0
    box_width = 768.0
    cx = 960.0
    cy = 762.0
    output = "DVI-D-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DVI-D-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.8
        background_radius = 8.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 8.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 512.0
    cx = 960.0
    cy = 348.0
    output = "DVI-D-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_padding = 8
        background_radius = 8
        center_text = true
        format = "{:%H:%M:%S}"
        shadow = true

[notification]
background_opacity = 0.8
filter_order = [ "filter" ]
offset_x = 16

[osd]
background_opacity = 0.8
offset_x = 16

[plugin_settings."noctalia/kaomoji"]
notify_on_copy = false

[plugin_settings."noctalia/wallhaven"]
browser_open_near_click = true
browser_placement = "floating"
browser_position = "center"

[plugins]
enabled = [ "noctalia/kaomoji", "noctalia/wallhaven" ]

[shell]
avatar_path = "/var/lib/AccountsService/icons/desyatkoff"
clipboard_auto_paste = "off"
clipboard_history_max_entries = 10000
font_family = "Noto Sans"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    sort_by_usage = false

    [shell.panel]
    list_item_background = true
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots"
    filename_pattern = "%Y-%m-%d_%H-%M-%S"
    show_cursor = true

    [shell.shadow]
    alpha = 0.8
    direction = "center"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/desyatkoff/Pictures/Wallpapers"
edge_smoothness = 1.0
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/desyatkoff/Pictures/Wallpapers/wallhaven-6dygpl.jpg"

    [wallpaper.last]
    path = "/home/desyatkoff/Pictures/Wallpapers/wallhaven-6dygpl.jpg"

    [wallpaper.monitors.DVI-D-1]
    path = "/home/desyatkoff/Pictures/Wallpapers/wallhaven-6dygpl.jpg"

[widget.clock]
format = "{:%b %d, %H:%M}"
tooltip_format = "{:%Y-%m-%d, %H:%M:%S}"

[widget.launcher]
custom_image = "/mnt/sdb1/desyatkoff/Random Shit/archlinux.svg"
custom_image_colorize = true
icon_color = "primary"
scale = 1.25

[widget.session]
custom_image_colorize = true
icon_color = "error"

[widget.tray]
drawer = true
drawer_columns = 5

[widget.workspaces]
active_pill_size = 2.0
pill_scale = 0.75
show_labels = false
